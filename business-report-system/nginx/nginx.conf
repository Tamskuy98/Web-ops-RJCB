server {

    listen 80;

    server_name rajacirengbekasi.web.id www.rajacirengbekasi.web.id;


    # untuk verifikasi certbot

    location /.well-known/acme-challenge/ {

        root /var/www/certbot;

    }


    # redirect HTTP ke HTTPS

    location / {

        return 301 https://$host$request_uri;

    }

}

server {

    listen 443 ssl;


    server_name rajacirengbekasi.web.id www.rajacirengbekasi.web.id;



    ssl_certificate
    /etc/letsencrypt/live/rajacirengbekasi.web.id/fullchain.pem;


    ssl_certificate_key
    /etc/letsencrypt/live/rajacirengbekasi.web.id/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;


    # FRONTEND

    location / {


        # proxy_pass http://frontend:80;
        try_files $uri $uri/ /index.html;


    }




    # BACKEND API

    location /api/ {


        proxy_pass http://backend:5000;



        proxy_set_header Host $host;


        proxy_set_header X-Real-IP $remote_addr;


    }

}